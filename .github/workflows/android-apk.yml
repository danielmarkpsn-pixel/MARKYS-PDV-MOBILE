name: Android APK
on:
  push:
    branches: [main, feat/flutter-mobile-base]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare Android
        run: |
          flutter create --platforms=android --org com.markys --project-name markys_pdv_mobile .
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          callback = '''<intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="com.markys.pdvmobile" android:host="login-callback" />
              </intent-filter>
              <meta-data android:name="flutter_deeplinking_enabled" android:value="false" />
              '''
          s = s.replace('</activity>', callback + '</activity>', 1)
          p.write_text(s)
          PY
          rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "Missing SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          flutter build apk --debug --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: MARKYS-PDV-MOBILE-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
